name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # 6.9+ required on macOS: Qt 6.8's prebuilt OpenGL config links the AGL
  # framework, which was removed from the SDK in Xcode 16.3.
  QT_VERSION: "6.9.3"

# Each platform builds two variants: the default lean build, and a
# "-webengine" build that includes Qt WebEngine so the Map Viewer plugin is
# compiled in (plugins/CMakeLists.txt skips it when WebEngineWidgets is
# absent). WebEngine adds roughly 150 MB per package, hence both.
# qtwebchannel and qtpositioning are aqt's dependency modules for qtwebengine.

jobs:
  linux:
    name: Linux (AppImage${{ matrix.variant }})
    # Built on 22.04 (glibc 2.35) so the AppImage runs on distros from ~2022
    # onward. gcc-13 comes from the toolchain PPA (core needs C++20); its newer
    # libstdc++/libgcc are linked statically so users don't need them installed.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            qt_modules: ""
          - variant: "-webengine"
            # qtserialport isn't used by logdor, but linuxdeploy-plugin-qt
            # deploys Qt's position plugins along with qtpositioning, and the
            # serialnmea one links libQt6SerialPort — without the module
            # installed the qt plugin aborts on the unresolvable dependency.
            qt_modules: "qtwebengine qtwebchannel qtpositioning qtserialport"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Install system dependencies
        run: |
          # Launchpad serves the PPA and is sometimes down for minutes at a
          # time (503s), so each network step gets a few tries.
          retry() {
            for i in 1 2 3 4; do
              "$@" && return
              echo "Attempt $i failed; retrying in 30 s"
              sleep 30
            done
            "$@"
          }
          retry sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          retry sudo apt-get update
          # The last row are WebEngineCore's runtime deps, needed so
          # linuxdeploy can resolve and bundle them; harmless for the lean
          # variant.
          retry sudo apt-get install -y -o Acquire::Retries=3 \
            gcc-13 g++-13 zlib1g-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

      - name: Configure and build
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          # Static libstdc++/libgcc on all three linker flag sets: the app
          # executable, liblogdor_interface.so, and the plugin modules each
          # need it for portability.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_MODULE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --parallel 4

      - name: Package AppImage
        run: |
          # Stage plugins and format specs straight from the build tree so
          # every binary keeps its full build rpath — linuxdeploy resolves
          # Qt and liblogdor_interface through those, then rewrites all
          # rpaths in the AppDir to $ORIGIN-relative ones.
          # Layout matches what PluginManager/FormatCatalog resolve relative
          # to usr/bin/logdor: usr/plugins and usr/share/logdor/formats.
          mkdir -p AppDir/usr/plugins AppDir/usr/share/logdor/formats
          cp build/plugins/*.so AppDir/usr/plugins/
          cp build/formats/*.json AppDir/usr/share/logdor/formats/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          # --deploy-deps-only makes linuxdeploy walk the staged plugin .so
          # files: their dependencies (e.g. libQt6WebEngineCore for mapviewer)
          # get bundled into usr/lib and the plugins' rpaths get rewritten,
          # without moving the plugins out of usr/plugins. Seeing WebEngine in
          # the AppDir then triggers the qt plugin's WebEngine handling
          # (QtWebEngineProcess, resources, locales).
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/app/logdor \
            --deploy-deps-only AppDir/usr/plugins \
            --desktop-file assets/linux/logdor.desktop \
            --icon-file app/resources/icons/logdor.png \
            --plugin qt \
            --output appimage
          mv Logdor-x86_64.AppImage Logdor-linux-x86_64${{ matrix.variant }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux${{ matrix.variant }}
          path: Logdor-linux-x86_64${{ matrix.variant }}.AppImage

  windows:
    name: Windows (zip${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            qt_modules: ""
          - variant: "-webengine"
            qt_modules: "qtwebengine qtwebchannel qtpositioning"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ matrix.qt_modules }}
          cache: true

      # zlib for LOGDOR_WITH_GZIP; static-md triplet links it into the core
      # so no extra DLL ships.
      - name: Install zlib
        run: vcpkg install zlib:x64-windows-static-md

      - name: Configure and build
        run: |
          cmake -B build -DBUILD_TESTING=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          # bin/logdor.exe + logdor_interface.dll, plugins/, share/logdor/formats/
          cmake --install build --config Release --prefix Logdor
          # The exe covers the Qt modules the lean plugins use; the mapviewer
          # dll is deployed explicitly so WebEngine (QtWebEngineProcess.exe,
          # resources, locales) gets bundled too.
          windeployqt --release --compiler-runtime --no-translations Logdor/bin/logdor.exe
          if (Test-Path Logdor/plugins/mapviewer.dll) {
            windeployqt --release --compiler-runtime --no-translations --dir Logdor/bin Logdor/plugins/mapviewer.dll
          }
          Compress-Archive -Path Logdor -DestinationPath Logdor-windows-x64${{ matrix.variant }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows${{ matrix.variant }}
          path: Logdor-windows-x64${{ matrix.variant }}.zip

  macos:
    name: macOS (dmg${{ matrix.variant }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            qt_modules: ""
          - variant: "-webengine"
            qt_modules: "qtwebengine qtwebchannel qtpositioning"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel 4

      - name: Package DMG
        env:
          # Optional. With these secrets set the app is signed with a
          # Developer ID and notarized, so it opens without a Gatekeeper
          # prompt; without them it is ad-hoc signed.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          APP=build/app/logdor.app
          DMG=Logdor-macos-universal${{ matrix.variant }}.dmg
          # PluginManager finds Contents/plugins (one level up from MacOS/);
          # FormatCatalog finds Contents/formats via ../formats.
          mkdir -p "$APP/Contents/plugins" "$APP/Contents/formats"
          cp build/plugins/*.dylib "$APP/Contents/plugins/"
          cp build/formats/*.json "$APP/Contents/formats/"
          # Pass each plugin to macdeployqt so their liblogdor_interface/Qt
          # references get rewritten to the bundled Frameworks copies. For the
          # webengine variant this also pulls in QtWebEngineCore and its
          # QtWebEngineProcess helper app. It leaves the bundle's signatures
          # invalid (macOS kills the app at launch), so sign.sh re-signs it.
          EXTRA=()
          for p in "$APP"/Contents/plugins/*.dylib; do EXTRA+=("-executable=$p"); done
          macdeployqt "$APP" "${EXTRA[@]}"

          IDENTITY=-
          if [[ -n $MACOS_CERTIFICATE ]]; then
            : "${MACOS_NOTARY_KEY:?the notary secrets must be set with the certificate}"
            KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain
            IDENTITY="Developer ID Application"
          fi
          assets/macos/sign.sh "$APP" "$IDENTITY"

          mkdir dmg
          mv "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Logdor -srcfolder dmg -fs HFS+ -format UDZO "$DMG"

          if [[ $IDENTITY != - ]]; then
            codesign --sign "$IDENTITY" --timestamp "$DMG"
            echo "$MACOS_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            NOTARY=(--key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID"
                    --issuer "$MACOS_NOTARY_ISSUER_ID")
            xcrun notarytool submit "$DMG" "${NOTARY[@]}" --wait --timeout 1h \
              --output-format json > notary.json
            cat notary.json
            if [[ $(plutil -extract status raw notary.json) != Accepted ]]; then
              xcrun notarytool log "$(plutil -extract id raw notary.json)" "${NOTARY[@]}"
              exit 1
            fi
            xcrun stapler staple "$DMG"
            spctl --assess --type open --context context:primary-signature -vv "$DMG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos${{ matrix.variant }}
          path: Logdor-macos-universal${{ matrix.variant }}.dmg

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Logdor-linux-x86_64.AppImage
            Logdor-linux-x86_64-webengine.AppImage
            Logdor-windows-x64.zip
            Logdor-windows-x64-webengine.zip
            Logdor-macos-universal.dmg
            Logdor-macos-universal-webengine.dmg
