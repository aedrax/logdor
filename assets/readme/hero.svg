      <g>
        <rect x="732" y="244" width="404" height="18" rx="3" fill="#79c0e8"/>
        <rect x="740" y="250" width="52" height="6" rx="3" fill="#0d1117" opacity="0.55"/>
        <rect x="800" y="250" width="185" height="6" rx="3" fill="#0d1117" opacity="0.55"/>
      </g>
